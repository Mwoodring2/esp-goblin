[platformio]
default_envs = hosyond_es3c28p
boards_dir = boards

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@2.5.1

build_unflags =
    -DILI9341_DRIVER
    -DILI9341_2_DRIVER
    -DST7789_DRIVER
    -DST7796_DRIVER

[env:hosyond_es3c28p]
board = hosyond_es3c28p
board_build.partitions = default_16MB.csv

build_flags =
    -DESP_GOBLIN_ES3C28P=1
    -DESP_GOBLIN_VERSION=\"0.1.0-alpha.0\"
    -DBOARD_HAS_PSRAM
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -include $PROJECT_DIR/include/es3c28p_tft_setup.h

extra_scripts =
    post:scripts/merge_factory.py
